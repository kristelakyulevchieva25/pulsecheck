spring:
  application:
    name: pulsecheck
  datasource:
    url: jdbc:postgresql://localhost:5433/pulsecheck
    username: pulsecheck
    password: pulsecheck
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-at-least-32-characters-long}
  expiration-ms: 3600000